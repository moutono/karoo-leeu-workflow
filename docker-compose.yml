version: '3.8'

services:
  n8n:
    build: .
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Africa/Johannesburg
      # Securely map credentials into the environment (pulling from your local .env file)
      - BOOKING_USER=${BOOKING_USER}
      - BOOKING_PASS=${BOOKING_PASS}
      # Allow the UI nodes to actually read $env expressions
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # Enables node_modules in the Code Node.
      # Enables node_modules in the Code Node.
      # Wildcard is used so absolute paths are not rejected by the task runner.
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
      - NODE_FUNCTION_ALLOW_BUILTIN=*
    volumes:
      - ./.n8n:/home/node/.n8n
